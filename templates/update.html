    {% extends "base.html" %}
    {% block title %}活動記録の編集{% endblock %}

    {% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h3 class="card-title text-primary mb-4">活動記録の編集</h3>
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label for="done" class="form-label fw-bold">やったこと（Y）</label>
                                <textarea class="form-control" name="done" id="done" rows="3" required>{{ post.done }}</textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="learned" class="form-label fw-bold">わかったこと（W）</label>
                                <textarea class="form-control" name="learned" id="learned" rows="3" required>{{ post.learned }}</textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="next_action" class="form-label fw-bold">次やること（T）</label>
                                <textarea class="form-control" name="next_action" id="next_action" rows="3" required>{{ post.next_action }}</textarea>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <button type="submit" class="btn btn-primary px-4">更新する</button>
                                <a href="/" class="btn btn-secondary">戻る</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    {% endblock %}
